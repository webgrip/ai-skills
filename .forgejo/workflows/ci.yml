# .forgejo/workflows/ci.yml
name: CI

# PR checks. Pushes to main run the same checks via release.yml before releasing.
# Forgejo notes:
#   - runs-on: docker (the only label the in-cluster runner advertises)
#   - container image: harbor.webgrip.dev/ghcr/webgrip/skills-ci-runner — the
#     webgrip/infrastructure CI image with node 24 + system python3 3.13/PyYAML
#     + git + the Claude Code CLI baked in. Pulled warm from the Harbor ghcr
#     pull-through (LAN) instead of pulling node:24-trixie from Docker Hub every
#     job (~4m "Set up job" stall). node is on PATH for the js actions (checkout).
#   - actions/checkout@v5 — resolves against data.forgejo.org; v6 is broken on
#     non-GitHub runners
#   - no `permissions:` block — Forgejo Actions ignores it; token scope is
#     whatever the repo/runner grants

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Manifests, dist & plugin tests
    runs-on: docker
    container:
      image: harbor.webgrip.dev/ghcr/webgrip/skills-ci-runner:latest
    steps:
      # Explicit token: the auto-injected Forgejo Actions token is rejected by
      # the git HTTP endpoint (401 → prompt → fail). WEBGRIP_CI_TOKEN is the
      # same known-good bot token the release job checks out with.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}

      - name: Conventional commits
        if: github.event_name == 'pull_request'
        run: |
          bad=0
          while IFS= read -r subject; do
            if ! printf '%s' "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'; then
              echo "not a conventional commit: $subject" >&2
              bad=1
            fi
          done < <(git log --no-merges --format=%s '${{ github.event.pull_request.base.sha }}..HEAD')
          exit $bad

      # Versions are computed at release time (per-skill trains,
      # scripts/release_skills.py); this guard keeps that automation sound:
      # skill changes must use a release-triggering commit type, and versions
      # must not be hand-edited.
      - name: Check plugin commits
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_plugin_commits.py '${{ github.event.pull_request.base.sha }}'

      - name: Check manifests
        run: python3 scripts/check_manifests.py

      - name: Check marketplace.json is generated
        run: python3 scripts/sync_marketplace.py --check

      - name: Lint skills
        run: python3 scripts/lint_skills.py

      - name: Check opencode config estate
        run: python3 scripts/check_opencode_config.py

      # Consumer-path smoke: the cross-tool installer must discover every
      # skill from a plain checkout — the flat skills/ tree's whole job.
      # The skills CLI does NOT auto-disable telemetry in CI, only tags it;
      # opt out explicitly.
      - name: Cross-tool install smoke
        env:
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: |
          # Capture BOTH streams (the CLI prints its summary UI to stderr in
          # non-TTY CI) and verify each skill by name — robust to stream, ANSI
          # styling, and the exact "Found N" wording.
          npx -y skills@latest add ./ --list > /tmp/skills-list.txt 2>&1 || true
          cat /tmp/skills-list.txt
          missing=0
          for d in skills/*/; do
            name=$(basename "$d")
            grep -qF "$name" /tmp/skills-list.txt || { echo "MISSING from CLI discovery: $name"; missing=1; }
          done
          if [ "$missing" != 0 ]; then echo "FAIL — some skills not discovered by the CLI"; exit 1; fi
          echo "install smoke OK — all $(ls -d skills/*/ | wc -l | tr -d ' ') skills discovered"

      # Anthropic's official manifest + frontmatter validator (the `claude` CLI is
      # baked into skills-ci-runner). --strict works here because plugin.json files
      # carry version/description (computed at release time — see CLAUDE.md).
      - name: Official plugin validation (strict)
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: claude plugin validate . --strict

      # test.sh is optional — only skills with plugin-specific behavior ship
      # one (generic quality rules live in scripts/lint_skills.py).
      - name: Run plugin test suites
        run: |
          for t in $(find skills -maxdepth 2 -name test.sh | sort); do
            echo "=== $t"
            bash "$t"
          done
