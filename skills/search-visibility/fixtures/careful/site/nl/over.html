<h1>Over de meetup</h1>
<p>Careful Site organiseert elke maand een avondmeetup voor engineers in de regio. Elke editie heeft twee talks van mensen uit de praktijk, eten van een lokale keuken en tijd om te praten met wie hier dingen bouwt. Toegang is gratis; er zijn veertig plekken.</p>
