apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-api
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["shop-api-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-api
subjects:
  - kind: ServiceAccount
    name: shop-api
