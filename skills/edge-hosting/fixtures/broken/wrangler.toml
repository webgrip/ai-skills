name = "shop"
main = "src/index.ts"
compatibility_date = "2027-01-01"
workers_dev = true
routes = [{ pattern = "shop.example.org/*", zone_name = "example.org" }]

[assets]
directory = "./dist"
run_worker_first = true

[vars]
STRIPE_API_KEY = "sk_live_placeholder"
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "shop"
database_id = "11111111-2222-3333-4444-555555555555"

[[kv_namespaces]]
binding = "CACHE"
id = "aaaabbbbccccddddeeeeffff00001111"

[env.staging]
name = "shop"
routes = [{ pattern = "staging.example.org/*", zone_name = "example.org" }]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "shop"
database_id = "11111111-2222-3333-4444-555555555555"
