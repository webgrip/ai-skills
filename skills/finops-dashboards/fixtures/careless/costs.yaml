---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: careless-costs
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: finops
  json: |-
    {
      "uid": "careless-costs",
      "title": "Cloud costs (careless)",
      "schemaVersion": 41,
      "timezone": "browser",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Cloud spend",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(node_total_hourly_cost) * 730",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "OpenCost node cost times hours."
        },
        {
          "id": 2,
          "type": "stat",
          "title": "LLM spend",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(llm_spend_usd)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2
            },
            "overrides": []
          },
          "description": "Provider spend."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Invoiced",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(invoice_amount_cents)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2
            },
            "overrides": []
          },
          "description": "Amount on the last invoice."
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Spend over time by namespace",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(namespace_cost_eur_total[1h])) * 3600",
              "legendFormat": "{{namespace}}"
            }
          ],
          "options": {},
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR"
            },
            "overrides": []
          },
          "description": "Hourly spend."
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Spend this month",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(cost_month_to_date_eur)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2,
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Month to date",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(cost_month_to_date_eur)",
              "instant": true
            }
          ],
          "options": {},
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2
            },
            "overrides": []
          },
          "description": "Spend since the 1st."
        },
        {
          "id": 7,
          "type": "table",
          "title": "Cost per pod",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 56
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(pod_cost_eur_total[5m])",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "sum by (namespace) (cost_month_to_date_eur) / scalar(sum(cost_month_to_date_eur))",
              "format": "table",
              "instant": true
            }
          ],
          "options": {
            "footer": {
              "show": true,
              "reducer": [
                "sum"
              ],
              "fields": [
                "Month to date EUR",
                "Share %"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Month to date EUR"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyEUR"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Share %"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "Value #A": "Month to date EUR",
                  "Value #B": "Share %"
                }
              }
            }
          ],
          "description": "Per pod cost and share."
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Node capacity cost",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_allocatable{resource=\"cpu\"}) * 0.031611 * 730",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2
            },
            "overrides": []
          },
          "description": "Allocatable cores priced per core-hour."
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Spend incl. tax",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 36
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(cost_month_to_date_eur) * 1.21",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2
            },
            "overrides": []
          },
          "description": "Gross spend."
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Month to date (picker)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(cost_eur_total[$__range]))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2
            },
            "overrides": []
          },
          "description": "Spend in the selected range."
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Exporter up",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 44
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{job=\"cost-exporter\"})",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "1 = the cost exporter is scraped."
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Cost exporter healthy",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 48
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(cost_refresh_success)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "background",
            "textMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "Green when the last refresh worked."
        }
      ]
    }
