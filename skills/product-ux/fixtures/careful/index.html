<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account - Ledger</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main">
    <h1>Create your account</h1>
    <div class="error-summary" role="alert" tabindex="-1" hidden>
      <h2>There is a problem</h2>
      <ul><li><a href="#email">Enter an email address in the format name@example.com</a></li></ul>
    </div>
    <form action="/signup" method="post" novalidate>
      <label for="email">Email address</label>
      <p id="email-hint" class="hint">We send the receipt here.</p>
      <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-hint email-error" spellcheck="false">
      <p id="email-error" class="field-error" hidden>Enter an email address in the format name@example.com</p>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint">
      <p id="password-hint" class="hint">At least 12 characters. A passphrase works well.</p>
      <button type="button" class="show-password" aria-pressed="false" aria-controls="password">Show password</button>

      <label for="country">Country <span class="optional">(optional)</span></label>
      <select id="country" name="country" autocomplete="country"><option value="NL">Netherlands</option></select>

      <label><input type="checkbox" name="updates"> Email me product updates</label>

      <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="/sign-in">Sign in to Ledger</a></p>
    <button type="button" class="icon-button" aria-label="Close panel"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 2l12 12"/></svg></button>
    <img src="statement.png" alt="March statement with three unpaid invoices highlighted" width="640" height="400">
  </main>
  <div class="toast-region" aria-live="polite"></div>
</body>
</html>
